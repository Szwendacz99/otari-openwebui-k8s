apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otari
  namespace: aitools
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otari
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: aitools
      ports:
      - protocol: TCP
        port: 8000
  egress:
    - to:
      - podSelector:
          matchLabels:
            app.kubernetes.io/name: tinyproxy
      ports:
      - protocol: TCP
        port: 8888
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
      ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
